apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-api
  labels:
    app: vulnerable-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-api
  template:
    metadata:
      labels:
        app: vulnerable-api
    spec:
      containers:
      - name: api
        image: vulnerable-api:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-api-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: vulnerable-api