apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-api
  namespace: prod
  labels:
    app: vulnerable-api
    env: prod
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vulnerable-api
  template:
    metadata:
      labels:
        app: vulnerable-api
        env: prod
    spec:
      containers:
      - name: api
        image: REGISTRY_PLACEHOLDER/vulnerable-dummy-security-application:IMAGE_TAG_PLACEHOLDER
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
