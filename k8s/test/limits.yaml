apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: test
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: "10m"
      memory: "16Mi"
    default:
      cpu: "100m"
      memory: "64Mi"
    min:
      cpu: "5m"
      memory: "8Mi"
    max:
      cpu: "250m"
      memory: "128Mi"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: test
spec:
  hard:
    pods: "6"
    requests.cpu: "250m"
    requests.memory: "256Mi"
    limits.cpu: "1"
    limits.memory: "512Mi"
